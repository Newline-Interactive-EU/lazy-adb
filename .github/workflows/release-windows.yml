name: Release Windows bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build portable Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name "Lazy ADB Wizard" --icon "android-logo.ico" --add-data "android-logo.ico;." --add-data "resources;resources" --add-data "output;output" main.py

      - name: Package release bundle
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $bundle = "Lazy-ADB-Wizard-Windows-$env:RELEASE_TAG.zip"
          Compress-Archive -Path "dist\\Lazy ADB Wizard\\*" -DestinationPath $bundle -Force
          "bundle=$bundle" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          BUNDLE: ${{ steps.package.outputs.bundle }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:BUNDLE --clobber
            gh release edit $env:RELEASE_TAG --latest
          } else {
            gh release create $env:RELEASE_TAG $env:BUNDLE --verify-tag --latest --title $env:RELEASE_TAG --generate-notes
          }
